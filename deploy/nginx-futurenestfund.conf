# GrantApp site (docs/DEPLOY.md). Install: cp deploy/nginx-futurenestfund.conf /etc/nginx/sites-available/futurenestfund
# HTTP only as committed; `certbot --nginx -d access.futurenestfund.org` adds HTTPS to the installed copy.
# The API port (3200) must match PORT in /etc/futurenestfund/api.env.
server {
    listen 80;
    server_name access.futurenestfund.org;

    root /var/www/futurenestfund-web/current;
    index index.html;

    # Uploads are capped at 10 MB by the API; a little extra for the form encoding.
    client_max_body_size 12m;
    server_tokens off;

    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built files have content hashes in their names, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Every other path is a page of the app (/admin, /auth/confirm, ...).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
