      properties:
        store: { type: string, enum: [memory, redis], description: "memory = counted by each API server on its own; redis = shared through RATE_LIMIT_REDIS_URL" }
        ok: { type: boolean, description: "redis: Redis answered just now. memory: false only when RATE_LIMIT_REDIS_URL is set but unusable" }
        address: { type: [string, "null"], description: "Redis address without the password" }
        error: { type: [string, "null"] }
      required: [store, ok, address, error]
    VirusScanStatus:
