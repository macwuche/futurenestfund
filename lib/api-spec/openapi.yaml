        release: { type: [string, "null"] }
        virusScan: { $ref: "#/components/schemas/VirusScanStatus" }
        rateLimits: { $ref: "#/components/schemas/RateLimitStatus" }
      required: [sentry, sentryHost, environment, release, virusScan, rateLimits]
    RateLimitStatus:
      type: object
