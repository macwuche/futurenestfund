openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Grant applicant and administration dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: applicant
    description: Applicant dashboard and profile
  - name: admin
    description: Administration dashboard and user controls
  - name: auth
    description: The signed-in caller and the download cookie
# Every endpoint except /healthz and /client-errors needs a Supabase access token. /applicant/* is for applicants, /admin/* for admin or root.
# GET requests may use the gp_session cookie (set by POST /auth/session) instead, so images and downloads work.
security:
  - supabaseBearer: []
  - sessionCookie: []
paths:
  /client-errors:
    post:
      operationId: reportClientError
      tags: [health]
      security: []
      summary: Report a browser crash (works signed out; rate limited per IP)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientErrorReport" }
      responses:
        "202":
          description: Logged (and forwarded when Sentry is configured)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientErrorReceipt" }
        "400":
          description: Not a valid report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/monitoring:
    get:
      operationId: getMonitoringStatus
      tags: [admin]
      summary: Where errors are reported (log only, or log and Sentry)
      responses:
        "200":
          description: Monitoring status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringStatus" }
  /admin/monitoring/test-error:
    post:
      operationId: triggerMonitoringTestError
      tags: [admin]
      summary: Raise a deliberate server error to check that errors are logged and reported
      responses:
        "500":
          description: Always; the body carries the request id to look for
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/settings/email:
    get:
      operationId: getEmailSettings
      tags: [admin]
      summary: Email settings in use (secrets only as hints) and where each value comes from
      responses:
        "200":
          description: Email settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
    put:
      operationId: updateEmailSettings
      tags: [admin]
      summary: Save email settings; fields left out are unchanged, empty text removes a value (falls back to the environment)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailSettingsUpdate" }
      responses:
        "200":
          description: The settings now in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
        "400":
          description: Invalid value, or secrets can't be stored (no SETTINGS_ENCRYPTION_KEY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/settings/email/secrets/{name}:
    delete:
      operationId: removeEmailSecret
      tags: [admin]
      summary: Remove a secret saved in Settings (the environment value, if any, is used again)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, enum: [resendApiKey, hookSecret] }
      responses:
        "200":
          description: The settings now in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
  /admin/settings/email/check:
    post:
      operationId: checkEmailHealth
      tags: [admin]
      summary: Run the email health checks (Resend key, sender domain, links, Supabase hook, outbox)
      responses:
        "200":
          description: Check results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailHealth" }
  /admin/settings/email/test:
    post:
      operationId: sendTestEmail
      tags: [admin]
      summary: Send a test email with the settings in use
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailTestInput" }
      responses:
        "200":
          description: Whether Resend accepted it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTestResult" }
        "400":
          description: Invalid address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      security: []
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Whether sign-in is on, and the public Supabase settings the browser needs
      security: []
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /branding:
    get:
      operationId: getBranding
      tags: [auth]
      summary: "The application's name, brand colour (with the shades the app uses) and logo; public: the sign-in pages need it"
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
  /branding/logo:
    get:
      operationId: getBrandingLogo
      tags: [auth]
      summary: The application's logo image (public)
      responses:
        "200":
          description: The image
          content:
            image/webp:
              schema: { type: string, format: binary }
        "404":
          description: No logo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/branding:
    get:
      operationId: getAdminBranding
      tags: [admin]
      summary: Branding with where the logo came from and the defaults
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBranding" }
    put:
      operationId: updateAdminBranding
      tags: [admin]
      summary: Set the application's name and brand colour
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrandingUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBranding" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/branding/logo:
    post:
      operationId: uploadAdminBrandingLogo
      tags: [admin]
      summary: Upload the logo (PNG, JPEG or WebP, up to 2 MB; re-encoded)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileUpload" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBranding" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: deleteAdminBrandingLogo
      tags: [admin]
      summary: Remove the logo (the name's first letter shows instead)
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBranding" }
  /admin/branding/logo-url:
    post:
      operationId: setAdminBrandingLogoUrl
      tags: [admin]
      summary: Take the logo from an https:// link (downloaded once and stored, never hot-linked)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoUrlInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBranding" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in caller
      responses:
        "200":
          description: Caller identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /auth/session:
    post:
      operationId: createSession
      tags: [auth]
      summary: Set the HttpOnly cookie that authenticates GET requests (images, downloads)
      description: Needs the bearer token; the cookie holds the same token and expires with it. Call again after each token refresh.
      security:
        - supabaseBearer: []
      responses:
        "200":
          description: Cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: deleteSession
      tags: [auth]
      summary: Clear the download cookie (on sign-out)
      security:
        - supabaseBearer: []
      responses:
        "204":
          description: Cleared
  /applicant/dashboard:
    get:
      operationId: getApplicantDashboard
      tags: [applicant]
      summary: Get applicant dashboard
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [weekly, monthly]
            default: weekly
      responses:
        "200":
          description: Applicant dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantDashboard"
  /applicant/profile:
    patch:
      operationId: updateApplicantProfile
      tags: [applicant]
      summary: Update applicant contact details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantProfileUpdate"
      responses:
        "200":
          description: Updated applicant profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantProfile"
  /industries:
    get:
      operationId: listIndustries
      tags: [auth]
      summary: The industries a user can choose from (Phase 11), A to Z. Public, for the sign-up form
      security: []
      responses:
        "200":
          description: Industries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Industry" } }
  /applicant/industry:
    put:
      operationId: setApplicantIndustry
      tags: [applicant]
      summary: Choose the applicant's industry (decides which grant plans are recommended)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndustryChoice" }
      responses:
        "200":
          description: Updated applicant profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantProfile" }
        "400":
          description: Unknown industry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/industries:
    get:
      operationId: listAdminIndustries
      tags: [admin]
      summary: Industries with how many plans and users use each
      responses:
        "200":
          description: Industries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminIndustry" } }
    post:
      operationId: createAdminIndustry
      tags: [admin]
      summary: Add an industry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndustryInput" }
      responses:
        "201":
          description: The whole list after the change
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminIndustry" } }
        "400":
          description: Invalid or duplicate name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/industries/{industryId}:
    patch:
      operationId: renameAdminIndustry
      tags: [admin]
      summary: Rename an industry
      parameters:
        - { name: industryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndustryInput" }
      responses:
        "200":
          description: The whole list after the change
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminIndustry" } }
        "400":
          description: Invalid or duplicate name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Industry not found
    delete:
      operationId: deleteAdminIndustry
      tags: [admin]
      summary: Remove an industry no grant plan uses; its users are asked to choose again
      parameters:
        - { name: industryId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The whole list after the change
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminIndustry" } }
        "400":
          description: Still used by a plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Industry not found
  /applicant/grant-plans:
    get:
      operationId: listApplicantGrantPlans
      tags: [applicant]
      summary: The grant plans open for applications (Phase 11), recommended ones first
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GrantPlan" } }
  /applicant/grant-plans/{planId}:
    get:
      operationId: getApplicantGrantPlan
      tags: [applicant]
      summary: One open grant plan, with its application form
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantPlan" }
        "404":
          description: Not found or switched off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/grant-plans/{planId}/logo:
    get:
      operationId: getApplicantGrantPlanLogo
      tags: [applicant]
      summary: A grant plan's logo image
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The image
          content:
            image/webp:
              schema: { type: string, format: binary }
        "404":
          description: No logo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/grant-plans:
    get:
      operationId: listAdminGrantPlans
      tags: [admin]
      summary: Every grant plan, newest first, with how many applications each has
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GrantPlan" } }
    post:
      operationId: createAdminGrantPlan
      tags: [admin]
      summary: Create a grant plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantPlanCreate" }
      responses:
        "201":
          description: The new plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantPlan" }
        "400":
          description: Invalid plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/grant-plans/{planId}:
    get:
      operationId: getAdminGrantPlan
      tags: [admin]
      summary: One grant plan
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantPlan" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    patch:
      operationId: updateAdminGrantPlan
      tags: [admin]
      summary: Change a grant plan (only the parts sent); submitted applications keep their own copy
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantPlanUpdate" }
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantPlan" }
        "400":
          description: Invalid plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: deleteAdminGrantPlan
      tags: [admin]
      summary: Delete a plan nobody applied to (otherwise switch it off)
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted
        "400":
          description: Has applications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/grant-plans/{planId}/logo:
    post:
      operationId: uploadAdminGrantPlanLogo
      tags: [admin]
      summary: Upload a plan's logo (PNG, JPEG or WebP, up to 2 MB)
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileUpload" }
      responses:
        "200":
          description: The plan with its new logo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantPlan" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: deleteAdminGrantPlanLogo
      tags: [admin]
      summary: Remove a plan's logo (the initials placeholder shows instead)
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantPlan" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/grant-plans/{planId}/logo-url:
    post:
      operationId: setAdminGrantPlanLogoUrl
      tags: [admin]
      summary: Take a plan's logo from an image link (downloaded once and stored; never hot-linked)
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoUrlInput" }
      responses:
        "200":
          description: The plan with its new logo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantPlan" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/preferences:
    patch:
      operationId: updateApplicantPreferences
      tags: [applicant]
      summary: Change the applicant's own notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicantPreferences" }
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantPreferences" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/account:
    get:
      operationId: getApplicantAccount
      tags: [applicant]
      summary: Get the applicant's balances, cards and money movements
      responses:
        "200":
          description: Applicant account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAccount"
  /applicant/card-types:
    get:
      operationId: listApplicantCardTypes
      tags: [applicant]
      summary: Card types on sale, with the price and fee of each kind
      responses:
        "200":
          description: Enabled card types; only priced kinds are present
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicantCardType" }
  /applicant/tier:
    get:
      operationId: getApplicantTier
      tags: [applicant]
      summary: "Step 9.4: the user's tier, what each tier allows, the next tier's upgrade form and the latest request"
      responses:
        "200":
          description: Tier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantTier" }
  /applicant/tier/requests:
    post:
      operationId: createApplicantTierRequest
      tags: [applicant]
      summary: Ask to move up one tier by sending the next tier's upgrade form
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/TierRequestForm" }
      responses:
        "201":
          description: Sent; the updated tier page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantTier" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/cards:
    post:
      operationId: buyApplicantCard
      tags: [applicant]
      summary: Buy a card; the price and fee are paid from the account balance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardBuyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantAccount" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/cards/{cardId}/top-up:
    post:
      operationId: topUpApplicantCard
      tags: [applicant]
      summary: Move money from the account balance to the card account (no fee)
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardTopUpInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantAccount" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/cards/{cardId}/actions:
    post:
      operationId: changeApplicantCard
      tags: [applicant]
      summary: Freeze or unfreeze your own card, or ask for a delivered physical card to be activated
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicantCardActionInput" }
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantAccount" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Card not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/requests:
    post:
      operationId: createApplicantRequest
      tags: [applicant]
      summary: Place a deposit or withdrawal request through one of the administrator's payment methods
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ApplicantRequestForm"
      responses:
        "201":
          description: Request recorded as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantTransaction"
        "400":
          description: Request refused
          content:
