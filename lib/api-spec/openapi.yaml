openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Grant applicant and administration dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: applicant
    description: Applicant dashboard and profile
  - name: admin
    description: Administration dashboard and user controls
  - name: auth
    description: The signed-in caller and the download cookie
# Every endpoint except /healthz and /client-errors needs a Supabase access token. /applicant/* is for applicants, /admin/* for admin or root.
# GET requests may use the gp_session cookie (set by POST /auth/session) instead, so images and downloads work.
security:
  - supabaseBearer: []
  - sessionCookie: []
paths:
  /client-errors:
    post:
      operationId: reportClientError
      tags: [health]
      security: []
      summary: Report a browser crash (works signed out; rate limited per IP)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientErrorReport" }
      responses:
        "202":
          description: Logged (and forwarded when Sentry is configured)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientErrorReceipt" }
        "400":
          description: Not a valid report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/monitoring:
    get:
      operationId: getMonitoringStatus
      tags: [admin]
      summary: Where errors are reported (log only, or log and Sentry)
      responses:
        "200":
          description: Monitoring status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringStatus" }
  /admin/monitoring/test-error:
    post:
      operationId: triggerMonitoringTestError
      tags: [admin]
      summary: Raise a deliberate server error to check that errors are logged and reported
      responses:
        "500":
          description: Always; the body carries the request id to look for
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/settings/email:
    get:
      operationId: getEmailSettings
      tags: [admin]
      summary: Email settings in use (secrets only as hints) and where each value comes from
      responses:
        "200":
          description: Email settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
    put:
      operationId: updateEmailSettings
      tags: [admin]
      summary: Save email settings; fields left out are unchanged, empty text removes a value (falls back to the environment)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailSettingsUpdate" }
      responses:
        "200":
          description: The settings now in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
        "400":
          description: Invalid value, or secrets can't be stored (no SETTINGS_ENCRYPTION_KEY)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/settings/email/secrets/{name}:
    delete:
      operationId: removeEmailSecret
      tags: [admin]
      summary: Remove a secret saved in Settings (the environment value, if any, is used again)
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, enum: [resendApiKey, hookSecret] }
      responses:
        "200":
          description: The settings now in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
  /admin/settings/email/check:
    post:
      operationId: checkEmailHealth
      tags: [admin]
      summary: Run the email health checks (Resend key, sender domain, links, Supabase hook, outbox)
      responses:
        "200":
          description: Check results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailHealth" }
  /admin/settings/email/test:
    post:
      operationId: sendTestEmail
      tags: [admin]
      summary: Send a test email with the settings in use
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailTestInput" }
      responses:
        "200":
          description: Whether Resend accepted it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTestResult" }
        "400":
          description: Invalid address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      security: []
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Whether sign-in is on, and the public Supabase settings the browser needs
      security: []
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /me:
    get:
      operationId: getMe
      tags: [auth]
      summary: The signed-in caller
      responses:
        "200":
          description: Caller identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /auth/session:
    post:
      operationId: createSession
      tags: [auth]
      summary: Set the HttpOnly cookie that authenticates GET requests (images, downloads)
      description: Needs the bearer token; the cookie holds the same token and expires with it. Call again after each token refresh.
      security:
        - supabaseBearer: []
      responses:
        "200":
          description: Cookie set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Not signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: deleteSession
      tags: [auth]
      summary: Clear the download cookie (on sign-out)
      security:
        - supabaseBearer: []
      responses:
        "204":
          description: Cleared
  /applicant/dashboard:
    get:
      operationId: getApplicantDashboard
      tags: [applicant]
      summary: Get applicant dashboard
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [weekly, monthly]
            default: weekly
      responses:
        "200":
          description: Applicant dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantDashboard"
  /applicant/profile:
    patch:
      operationId: updateApplicantProfile
      tags: [applicant]
      summary: Update applicant contact details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantProfileUpdate"
      responses:
        "200":
          description: Updated applicant profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantProfile"
  /applicant/preferences:
    patch:
      operationId: updateApplicantPreferences
      tags: [applicant]
      summary: Change the applicant's own notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicantPreferences" }
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantPreferences" }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/matchmaking:
    get:
      operationId: getApplicantMatchmaking
      tags: [applicant]
      summary: The applicant's matchmaking answers and every sample grant scored against them (rule-based, no AI)
      responses:
        "200":
          description: Answers (null until answered) and matches, best first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Matchmaking" }
    put:
      operationId: saveApplicantMatchmaking
      tags: [applicant]
      summary: Save (or replace) the applicant's matchmaking answers
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchmakingAnswers" }
      responses:
        "200":
          description: Saved answers and fresh matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Matchmaking" }
        "400":
          description: Invalid answers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/account:
    get:
      operationId: getApplicantAccount
      tags: [applicant]
      summary: Get the applicant's balances, cards and money movements
      responses:
        "200":
          description: Applicant account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantAccount"
  /applicant/cards/{cardId}/actions:
    post:
      operationId: changeApplicantCard
      tags: [applicant]
      summary: Freeze or unfreeze your own card, or ask for a delivered physical card to be activated
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicantCardActionInput" }
      responses:
        "200":
          description: The updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantAccount" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Card not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/requests:
    post:
      operationId: createApplicantRequest
      tags: [applicant]
      summary: Submit a demo deposit or withdrawal request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicantRequestInput"
      responses:
        "201":
          description: Request recorded as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicantTransaction"
        "400":
          description: Request refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
  /applicant/applications:
    get:
      operationId: listApplicantApplications
      tags: [applicant]
      summary: List the applicant's applications
      responses:
        "200":
          description: Applications, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicantApplication" }
    post:
      operationId: createApplicantApplication
      tags: [applicant]
      summary: Submit a new application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
  /applicant/applications/{applicationId}:
    get:
      operationId: getApplicantApplication
      tags: [applicant]
      summary: Get one application with its status history
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/applications/{applicationId}/withdraw:
    post:
      operationId: withdrawApplicantApplication
      tags: [applicant]
      summary: Withdraw a submitted application
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
  /applicant/applications/{applicationId}/respond:
    post:
      operationId: respondToApplicantApplication
      tags: [applicant]
      summary: Reply to requested changes and resubmit
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationResponseInput" }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
  /applicant/avatar:
    post:
      operationId: uploadApplicantAvatar
      tags: [applicant]
      summary: Upload a profile photo (JPEG, PNG or WebP, re-encoded on the server)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileUpload" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantProfile" }
        "400":
          description: File or request refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: deleteApplicantAvatar
      tags: [applicant]
      summary: Remove the profile photo
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantProfile" }
  /applicant/kyc:
    get:
      operationId: getApplicantKyc
      tags: [applicant]
      summary: Get the applicant's identity verification status and current documents
      responses:
        "200":
          description: Verification status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantKyc" }
  /applicant/kyc/documents:
    post:
      operationId: uploadApplicantKycDocument
      tags: [applicant]
      summary: Upload or replace an identity document (image or PDF)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/KycUpload" }
      responses:
        "201":
          description: Document stored and queued for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicantKyc" }
        "400":
          description: File or request refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/applications/{applicationId}/documents:
    post:
      operationId: uploadApplicantApplicationDocument
      tags: [applicant]
      summary: Attach a proposal document (PDF or Word) to an application
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileUpload" }
      responses:
        "201":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400":
          description: File or request refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/applications/{applicationId}/documents/{fileId}:
    delete:
      operationId: deleteApplicantApplicationDocument
      tags: [applicant]
      summary: Remove an attached document while the application can still be edited
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        "400":
          description: File or request refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/files/{fileId}:
    get:
      operationId: getApplicantFile
      tags: [applicant]
      summary: Download one of the applicant's own files
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: File contents
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /applicant/milestones:
    get:
      operationId: listApplicantMilestones
      tags: [applicant]
      summary: List milestones
      responses:
        "200":
          description: Milestones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Milestone" }
    post:
      operationId: createApplicantMilestone
      tags: [applicant]
      summary: Add a milestone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneInput" }
      responses:
        "201":
          description: Created milestone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
  /applicant/milestones/{milestoneId}:
    patch:
      operationId: updateApplicantMilestone
      tags: [applicant]
      summary: Mark a milestone done or not done
      parameters:
        - { name: milestoneId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneUpdate" }
      responses:
        "200":
          description: Updated milestone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
    delete:
      operationId: deleteApplicantMilestone
      tags: [applicant]
      summary: Delete a milestone
      parameters:
        - { name: milestoneId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted
  /applicant/notifications:
    get:
      operationId: listApplicantNotifications
      tags: [applicant]
      summary: Recent notifications
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
  /applicant/notifications/read:
    post:
      operationId: markApplicantNotificationsRead
      tags: [applicant]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Updated list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationList" }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get platform operations overview
      responses:
        "200":
          description: Admin dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Search and list user profiles
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, active, frozen]
            default: all
        - { name: sort, in: query, required: false, schema: { type: string, enum: [name, joined, grant, deposit, tier, status], default: name } }
        - { name: dir, in: query, required: false, schema: { type: string, enum: [asc, desc] }, description: "Default: asc for name, tier and status; desc for joined and balances" }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 25 } }
      responses:
        "200":
          description: One page of the user directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"
  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      tags: [admin]
      summary: Get an admin user profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile and controls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProfile"
        "404":
          description: User not found
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update a user profile and access controls
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProfile"
        "404":
          description: User not found
  /admin/users/{userId}/balance-adjustments:
    post:
      operationId: createUserBalanceAdjustment
      tags: [admin]
      summary: Credit or debit a balance, with a ledger entry, an audit record and a notification
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAdjustmentInput"
      responses:
        "200":
          description: Adjusted account balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBalances"
        "404":
          description: User not found
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: The signed-in administrator's own profile (name, email, photo)
      responses:
        "200":
          description: Administrator profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccount" }
  /admin/me/avatar:
    post:
      operationId: uploadAdminAvatar
      tags: [admin]
      summary: Upload the administrator's own photo (JPEG, PNG or WebP, re-encoded on the server)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileUpload" }
      responses:
        "200":
          description: Updated administrator profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccount" }
        "400":
          description: File or request refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: deleteAdminAvatar
      tags: [admin]
      summary: Remove the administrator's own photo
      responses:
        "200":
          description: Updated administrator profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccount" }
  /admin/users/{userId}/avatar:
    post:
      operationId: uploadAdminUserAvatar
      tags: [admin]
      summary: Set a user's profile photo (audited; the user is notified)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileUpload" }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserProfile" }
        "400":
          description: File or request refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: deleteAdminUserAvatar
      tags: [admin]
      summary: Remove a user's profile photo (audited; the user is notified)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserProfile" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/users/{userId}/cards:
    post:
      operationId: issueUserCard
      tags: [admin]
      summary: Issue a sample card (virtual cards are active at once; physical ones stay pending until marked issued)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardIssueInput" }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserProfile" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: User not found
  /admin/users/{userId}/cards/{cardId}/actions:
    post:
      operationId: changeUserCard
      tags: [admin]
      summary: Activate, freeze, unfreeze or cancel a card
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: cardId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardActionInput" }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserProfile" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: User or card not found
  /admin/users/{userId}/withdrawal-limits:
    put:
      operationId: updateUserWithdrawalLimits
      tags: [admin]
      summary: Use the global withdrawal limits for this user, or set custom ones that replace them
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserWithdrawalLimitsUpdate"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProfile"
        "400":
          description: Invalid limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: User not found
  /admin/system/withdrawal-limits:
    get:
      operationId: getWithdrawalLimits
      tags: [admin]
      summary: The global withdrawal limits
      responses:
        "200":
          description: Global limits (null = no limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalLimits"
    put:
      operationId: updateWithdrawalLimits
      tags: [admin]
      summary: Set the global withdrawal limits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalLimits"
      responses:
        "200":
          description: Updated global limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalLimits"
        "400":
          description: Invalid limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/files/{fileId}:
    get:
      operationId: getAdminFile
      tags: [admin]
      summary: Download any user's file for review
      parameters:
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: File contents
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/system/freeze:
    patch:
      operationId: updateGlobalFreeze
      tags: [admin]
      summary: Toggle the demo platform freeze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlobalFreezeUpdate"
      responses:
        "200":
          description: Updated freeze status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalFreezeStatus"
  /admin/search:
    get:
      operationId: searchAdmin
      tags: [admin]
      summary: Search users, applications, ledger entries and audit logs by name or ID
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        "200":
          description: Up to five matches per group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSearchResults" }
  /admin/applications:
    get:
      operationId: listAdminApplications
      tags: [admin]
      summary: List applications for review
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, all], default: all } }
        - { name: userId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Applications, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminApplication" }
  /admin/applications/{applicationId}:
    get:
      operationId: getAdminApplication
      tags: [admin]
      summary: Get an application with its documents and history
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminApplicationDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/applications/{applicationId}/decision:
    post:
      operationId: decideAdminApplication
      tags: [admin]
      summary: Move an application to review, approve, decline or request changes
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationDecisionInput" }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminApplicationDetail" }
        "400":
          description: Decision refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/requests:
    get:
      operationId: listAdminRequests
      tags: [admin]
      summary: List deposit or withdrawal requests
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [Deposit, Withdrawal] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, decided], default: pending } }
      responses:
        "200":
          description: Requests (pending oldest first, decided newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminRequest" }
  /admin/requests/{requestId}/approve:
    post:
      operationId: approveAdminRequest
      tags: [admin]
      summary: Approve a pending request and move the money
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Approved request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRequest" }
        "400":
          description: Approval refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/requests/{requestId}/reject:
    post:
      operationId: rejectAdminRequest
      tags: [admin]
      summary: Decline a pending request with a reason
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "200":
          description: Declined request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRequest" }
  /admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [admin]
      summary: Search the ledger
      parameters: &ledgerFilters
        - { name: type, in: query, required: false, schema: { type: string, enum: [all, Top-up, Debit, Deposit, Withdrawal, Grant award, Opening balance], default: all } }
        - { name: userId, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
        - { name: to, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: One page of ledger entries, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLedgerPage" }
  /admin/transactions/export:
    get:
      operationId: exportAdminTransactions
      tags: [admin]
      summary: Download the filtered ledger as CSV
      parameters: *ledgerFilters
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /admin/audit:
    get:
      operationId: listAdminAudit
      tags: [admin]
      summary: Search the audit log
      parameters: &auditFilters
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: userId, in: query, required: false, schema: { type: string, maxLength: 100 }, description: "A user ID, or 'platform' for entries not tied to a user" }
        - { name: actor, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: from, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
        - { name: to, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: One page of audit entries, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditPage" }
        "400":
          description: Invalid filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/audit/export:
    get:
      operationId: exportAdminAudit
      tags: [admin]
      summary: Download the filtered audit log as CSV
      parameters: *auditFilters
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /admin/kyc:
    get:
      operationId: getAdminKycQueue
      tags: [admin]
      summary: Identity documents awaiting review, and recent decisions
      responses:
        "200":
          description: KYC queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminKycQueue" }
  /admin/kyc/documents/{documentId}/review:
    post:
      operationId: reviewAdminKycDocument
      tags: [admin]
      summary: Approve or reject an identity document
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycReviewInput" }
      responses:
        "200":
          description: Reviewed document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminKycItem" }
        "400":
          description: Review refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: gp_session
  schemas:
    ApplicantPreferences:
      type: object
      properties:
        emailNotifications: { type: boolean }
      required: [emailNotifications]
      additionalProperties: false
    AuthConfig:
      type: object
      properties:
        mode: { type: string, enum: [supabase, demo] }
        supabaseUrl: { type: [string, "null"] }
        publishableKey: { type: [string, "null"] }
        supportEmail: { type: [string, "null"], description: "Where people can write for help (Admin Settings → Email)" }
      required: [mode, supabaseUrl, publishableKey, supportEmail]
    Me:
      type: object
      properties:
        mode: { type: string, enum: [supabase, demo] }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [applicant, admin, root] }
        profileId: { type: [string, "null"] }
      required: [mode, email, name, role, profileId]
    Session:
      type: object
      properties:
        expiresAt: { type: [string, "null"], format: date-time }
      required: [expiresAt]
    ErrorMessage:
      type: object
      properties:
        error: { type: string }
        requestId: { type: string, description: "Only on 500 errors: the request id in the server log (the message quotes its first 8 characters)" }
      required: [error]
    ClientErrorReport:
      type: object
      description: "A crash in the browser. Logged on the server and, when SENTRY_DSN is set, forwarded to Sentry with personal data scrubbed."
      properties:
        kind: { type: string, enum: [error, unhandledrejection, boundary, test] }
        type: { type: string, maxLength: 100, description: "Error class, e.g. TypeError" }
        message: { type: string, maxLength: 1000 }
        stack: { type: string, maxLength: 8000 }
        path: { type: string, maxLength: 300, description: "The page's path, without the query string" }
      required: [kind, message, path]
      additionalProperties: false
    ClientErrorReceipt:
      type: object
      properties:
        reference: { type: string, description: "Short reference to quote to support; it is in the server log" }
      required: [reference]
    EmailSettingSource:
      type: string
      enum: [settings, environment, none]
    EmailSettingValue:
      type: object
      properties:
        value: { type: [string, "null"] }
        source: { $ref: "#/components/schemas/EmailSettingSource" }
      required: [value, source]
    EmailSecretStatus:
      type: object
      properties:
        set: { type: boolean }
        source: { $ref: "#/components/schemas/EmailSettingSource" }
        hint: { type: [string, "null"], description: "e.g. re_••••abcd; the secret itself is never returned" }
        updatedAt: { type: [string, "null"] }
        updatedBy: { type: [string, "null"] }
        unreadable: { type: boolean, description: "Saved, but can't be decrypted with the current SETTINGS_ENCRYPTION_KEY" }
      required: [set, source, hint, updatedAt, updatedBy, unreadable]
    EmailSettings:
      type: object
      properties:
        canStoreSecrets: { type: boolean }
        encryptionProblem: { type: [string, "null"] }
        apiKey: { $ref: "#/components/schemas/EmailSecretStatus" }
        hookSecret: { $ref: "#/components/schemas/EmailSecretStatus" }
        fromName: { $ref: "#/components/schemas/EmailSettingValue" }
        fromAddress: { $ref: "#/components/schemas/EmailSettingValue" }
        replyTo: { $ref: "#/components/schemas/EmailSettingValue" }
        signature: { $ref: "#/components/schemas/EmailSettingValue" }
        supportEmail: { $ref: "#/components/schemas/EmailSettingValue" }
        from: { type: [string, "null"], description: "The From header in use" }
        sending: { type: boolean, description: "Whether email can be sent (key and sender address set)" }
        appUrl: { type: [string, "null"] }
        hookUrl: { type: [string, "null"], description: "The URL to paste into Supabase's Send Email Hook" }
        updatedAt: { type: [string, "null"] }
        updatedBy: { type: [string, "null"] }
      required: [canStoreSecrets, encryptionProblem, apiKey, hookSecret, fromName, fromAddress, replyTo, signature, supportEmail, from, sending, appUrl, hookUrl, updatedAt, updatedBy]
    EmailSettingsUpdate:
      type: object
      properties:
        fromName: { type: [string, "null"], maxLength: 200 }
        fromAddress: { type: [string, "null"], maxLength: 300 }
        replyTo: { type: [string, "null"], maxLength: 300 }
        signature: { type: [string, "null"], maxLength: 1000 }
        supportEmail: { type: [string, "null"], maxLength: 300 }
        apiKey: { type: string, maxLength: 300, description: "New Resend API key; leave out to keep the current one" }
        hookSecret: { type: string, maxLength: 300, description: "New Send Email Hook secret (v1,whsec_…); leave out to keep the current one" }
      additionalProperties: false
    EmailHealthCheck:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [ok, warn, fail, "off"] }
        detail: { type: string }
      required: [id, label, status, detail]
    EmailDomainRecord:
      type: object
      properties:
        record: { type: string }
        type: { type: string }
        name: { type: string }
        status: { type: string }
      required: [record, type, name, status]
    EmailHealth:
      type: object
      properties:
        checkedAt: { type: string }
        checks:
          type: array
          items: { $ref: "#/components/schemas/EmailHealthCheck" }
        domain:
          type: [object, "null"]
          properties:
            name: { type: string }
            status: { type: string }
            records:
              type: array
              items: { $ref: "#/components/schemas/EmailDomainRecord" }
          required: [name, status, records]
        outbox:
          type: object
          properties:
            waiting: { type: integer }
            retrying: { type: integer }
            failed: { type: integer }
            sentLast24h: { type: integer }
            lastSentAt: { type: [string, "null"] }
            lastError: { type: [string, "null"] }
            lastErrorAt: { type: [string, "null"] }
          required: [waiting, retrying, failed, sentLast24h, lastSentAt, lastError, lastErrorAt]
      required: [checkedAt, checks, domain, outbox]
    EmailTestInput:
      type: object
      properties:
        to: { type: string, maxLength: 254 }
      required: [to]
    EmailTestResult:
      type: object
      properties:
        ok: { type: boolean }
        to: { type: string }
        id: { type: [string, "null"] }
        message: { type: string }
      required: [ok, to, id, message]
    MonitoringStatus:
      type: object
      properties:
        sentry: { type: boolean, description: "Whether errors are also sent to Sentry (SENTRY_DSN is set and valid)" }
        sentryHost: { type: [string, "null"] }
        environment: { type: string }
        release: { type: [string, "null"] }
      required: [sentry, sentryHost, environment, release]
    ApplicantTransaction:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [Deposit, Withdrawal, Top-up, Debit, Grant award, Opening balance] }
        account: { type: string, enum: [grant, deposit, card] }
        direction: { type: string, enum: [in, out] }
        amount: { type: number }
        description: { type: string }
        status: { type: string, enum: [Pending, Completed, Declined] }
        createdAt: { type: string, format: date-time }
        reference: { type: string, description: "Short reference for a deposit or withdrawal request" }
        reviewNote: { type: string, description: "Why a request was declined" }
      required: [id, type, account, direction, amount, description, status, createdAt]
    ApplicantAccount:
      type: object
      properties:
        status: { type: string, enum: [Active, Frozen] }
        platformFrozen: { type: boolean }
        tier: { type: integer, minimum: 1, maximum: 3 }
        verificationLevel: { type: string, enum: [Verified, Pending, Rejected, Unsubmitted] }
        permissions: { $ref: "#/components/schemas/UserPermissions" }
        balances: { $ref: "#/components/schemas/UserBalances" }
        availableToWithdraw: { type: number }
        cards:
          type: array
          items: { $ref: "#/components/schemas/UserCard" }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/ApplicantTransaction" }
        withdrawalLimits: { $ref: "#/components/schemas/EffectiveWithdrawalLimits" }
      required: [status, platformFrozen, tier, verificationLevel, permissions, balances, availableToWithdraw, cards, transactions, withdrawalLimits]
    ApplicantRequestInput:
      type: object
      properties:
        kind: { type: string, enum: [Deposit, Withdrawal] }
        amount: { type: number, minimum: 0.01 }
        note: { type: string, maxLength: 240 }
      required: [kind, amount]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ApplicantProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        organization: { type: string }
        verified: { type: boolean }
        phone: { type: string }
        telegram: { type: string }
        avatarUrl: { type: string, description: "Same-origin URL of the profile photo; absent when none is set" }
      required: [id, name, email, organization, verified, phone, telegram]
    ApplicantProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, maxLength: 40 }
        telegram: { type: string, maxLength: 80 }
    ApplicantApplication:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        status:
          type: string
          enum: [Submitted, Review, Approved, Changes requested, Declined, Withdrawn]
        amount: { type: number }
        submittedAt: { type: string, format: date-time }
      required: [id, title, category, status, amount, submittedAt]
    ApplicationInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        category: { type: string, minLength: 1, maxLength: 60 }
        amount: { type: number, minimum: 100, maximum: 10000000 }
      required: [title, category, amount]
    ApplicationEvent:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        note: { type: string }
        actor: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, status, note, actor, createdAt]
    ApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/ApplicantApplication"
        - type: object
          properties:
            updatedAt: { type: string, format: date-time }
            canWithdraw: { type: boolean }
            canRespond: { type: boolean }
            canAttach: { type: boolean, description: "Whether documents can still be attached or removed" }
            documents:
              type: array
              items: { $ref: "#/components/schemas/StoredDocument" }
            events:
              type: array
              items: { $ref: "#/components/schemas/ApplicationEvent" }
          required: [updatedAt, canWithdraw, canRespond, canAttach, documents, events]
    ApplicationResponseInput:
      type: object
      properties:
        note: { type: string, minLength: 5, maxLength: 1000 }
        amount: { type: number, minimum: 100, maximum: 10000000 }
      required: [note]
    Milestone:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        grant: { type: string }
        due: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        done: { type: boolean }
      required: [id, title, grant, due, done]
    MilestoneInput:
      type: object
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        grant: { type: string, minLength: 1, maxLength: 120 }
        due: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
      required: [title, grant, due]
    MilestoneUpdate:
      type: object
      properties:
        done: { type: boolean }
      required: [done]
    Notification:
      type: object
      properties:
        id: { type: string }
        message: { type: string }
        link: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, message, read, createdAt]
    NotificationList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unread: { type: integer }
      required: [items, unread]
    FundingPoint:
      type: object
      properties:
        label: { type: string }
        submitted: { type: number }
        review: { type: number }
      required: [label, submitted, review]
    SetupCard:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        actionLabel: { type: string }
        complete: { type: boolean }
      required: [id, title, description, actionLabel, complete]
    GrantHighlight:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string }
        amount: { type: number }
        deadline: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        recommended: { type: boolean, description: "From matchmaking: eligible, open and scoring at least 70. Always false before the questionnaire is answered." }
        matchScore: { type: integer, minimum: 0, maximum: 100, description: "Matchmaking score; absent before the questionnaire is answered" }
        matchReasons: { type: array, items: { type: string }, description: "One reason per rule that awarded points (or why the grant doesn't fit)" }
      required: [id, title, category, amount, deadline, recommended]
    MatchmakingAnswers:
      type: object
      properties:
        orgType: { type: string, enum: [Nonprofit, Small business, Individual or artist, School or university, Community group] }
        focusAreas:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: { type: string, enum: [Technology & innovation, Arts & culture, Community, Environment, Education, Health] }
        goals:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, enum: [Start a new project, Grow an existing program, Research and development, Equipment, Operating costs] }
        fundingSize: { type: string, enum: [under10k, 10to30k, over30k, any] }
        timeline: { type: string, enum: [30days, 90days, flexible] }
      required: [orgType, focusAreas, goals, fundingSize, timeline]
    GrantMatch:
      type: object
      properties:
        grantId: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        eligible: { type: boolean }
        open: { type: boolean }
        recommended: { type: boolean }
        reasons: { type: array, items: { type: string } }
      required: [grantId, score, eligible, open, recommended, reasons]
    Matchmaking:
      type: object
      properties:
        answers:
          oneOf:
            - { $ref: "#/components/schemas/MatchmakingAnswers" }
            - { type: "null" }
        matches:
          type: array
          items: { $ref: "#/components/schemas/GrantMatch" }
      required: [answers, matches]
    ApplicantDashboard:
      type: object
      properties:
        profile: { $ref: "#/components/schemas/ApplicantProfile" }
        totalBudget: { type: number }
        allocatedFunds: { type: number }
        remainingFunds: { type: number }
        fundingTrend:
          type: array
          items: { $ref: "#/components/schemas/FundingPoint" }
        setupCards:
          type: array
          items: { $ref: "#/components/schemas/SetupCard" }
        highlights:
          type: array
          items: { $ref: "#/components/schemas/ApplicantApplication" }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/GrantHighlight" }
        applicationCount: { type: integer }
      required: [profile, totalBudget, allocatedFunds, remainingFunds, fundingTrend, setupCards, highlights, recommendations, applicationCount]
    AdminDashboard:
      type: object
      properties:
        totalUsers: { type: integer }
        activeUsers: { type: integer }
        pendingApplications: { type: integer }
        pendingKyc: { type: integer }
        pendingDeposits: { type: integer }
        pendingWithdrawals: { type: integer }
        totalGrantBalances: { type: number }
        totalDepositBalances: { type: number }
        applicationsByStatus:
          type: array
          items: { $ref: "#/components/schemas/StatusCount" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/AdminActivity" }
        systemHealth: { $ref: "#/components/schemas/SystemHealth" }
        globalFrozen: { type: boolean }
        moneyTrend:
          type: array
          description: Ledger money in and out per month, last six months
          items: { $ref: "#/components/schemas/MoneyPoint" }
      required: [totalUsers, activeUsers, pendingApplications, pendingKyc, pendingDeposits, pendingWithdrawals, totalGrantBalances, totalDepositBalances, applicationsByStatus, recentActivity, systemHealth, globalFrozen, moneyTrend]
    MoneyPoint:
      type: object
      properties:
        label: { type: string }
        inflow: { type: number }
        outflow: { type: number }
      required: [label, inflow, outflow]
    StatusCount:
      type: object
      properties:
        status: { type: string }
        count: { type: integer }
      required: [status, count]
    AdminActivity:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        subject: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, action, subject, createdAt]
    SystemHealth:
      type: object
      properties:
        api: { type: string, enum: [Operational, Degraded, Offline] }
        database: { type: string, enum: [Operational, Degraded, Offline] }
        auditLog: { type: string, enum: [Intact, Review required] }
        fourEyes: { type: boolean }
      required: [api, database, auditLog, fourEyes]
    AdminUserSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        organization: { type: string }
        tier: { type: integer, minimum: 1, maximum: 3 }
        verificationLevel: { type: string, enum: [Verified, Pending, Rejected, Unsubmitted] }
        status: { type: string, enum: [Active, Frozen] }
        grantBalance: { type: number }
        depositBalance: { type: number }
        joinedAt: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        pendingKycDocuments: { type: integer, description: "Current identity documents awaiting review" }
      required: [id, name, email, organization, tier, verificationLevel, status, grantBalance, depositBalance, joinedAt, pendingKycDocuments]
    AdminUsersPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUserSummary" }
        total: { type: integer, description: "All matching users, across pages" }
        page: { type: integer }
        pageSize: { type: integer }
      required: [items, total, page, pageSize]
    UserBalances:
      type: object
      properties:
        grant: { type: number }
        deposit: { type: number }
        card: { type: number }
      required: [grant, deposit, card]
    UserCard:
      type: object
      properties:
        id: { type: string }
        network: { type: string, enum: [Visa, Mastercard] }
        kind: { type: string, enum: [Virtual, Physical] }
        lastFour: { type: string }
        status: { type: string, enum: [Active, Frozen, Pending, Cancelled] }
        balance: { type: number }
        statusReason: { type: string, description: "Why an administrator froze or cancelled the card" }
        frozenBy: { type: string, enum: [user, admin], description: "Who froze a frozen card; a card frozen by an administrator stays locked to the user" }
        activationRequestedAt: { type: string, format: date-time, description: "When the user said a pending physical card arrived and asked for it to be activated" }
        issuedAt: { type: string, format: date-time }
      required: [id, network, kind, lastFour, status, balance]
    KycDocument:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [Government ID, Proof of address] }
        status: { type: string, enum: [Verified, Pending, Rejected] }
        sample: { type: boolean, description: "Seeded sample document with no file" }
        confidence: { type: number, description: "Demonstration OCR score; only present on sample documents" }
        url: { type: string, description: "Same-origin download URL for uploaded documents" }
        mimeType: { type: string }
        submittedAt: { type: string, format: date-time }
        reviewNote: { type: string, description: "Reviewer's reason, shown when a document is rejected" }
        reviewedAt: { type: string, format: date-time }
      required: [id, name, kind, status, sample, submittedAt]
    ApplicantKyc:
      type: object
      properties:
        verificationLevel: { type: string, enum: [Verified, Pending, Rejected, Unsubmitted] }
        documents:
          type: array
          description: Current document per kind (replaced ones are omitted)
          items: { $ref: "#/components/schemas/KycDocument" }
      required: [verificationLevel, documents]
    StoredDocument:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        url: { type: string }
        uploadedAt: { type: string, format: date-time }
      required: [id, name, mimeType, sizeBytes, url, uploadedAt]
    AdminAccount:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: string, description: "Same-origin URL of the administrator's photo; absent when none is set" }
      required: [name, email]
    FileUpload:
      type: object
      properties:
        file: { type: string, format: binary }
      required: [file]
    KycUpload:
      type: object
      properties:
        kind: { type: string, enum: [Government ID, Proof of address] }
        file: { type: string, format: binary }
      required: [kind, file]
    UserPermissions:
      type: object
      properties:
        emailNotifications: { type: boolean }
        withdrawalKycRequired: { type: boolean }
        depositKycRequired: { type: boolean }
        emailOverride: { type: [boolean, "null"], description: "Set by an administrator: true/false forces email notifications on/off whatever the user chose; null leaves it to the user" }
        inAppOverride: { type: [boolean, "null"], description: "Set by an administrator: false hides in-app notifications from the user; null/true shows them" }
      required: [emailNotifications, withdrawalKycRequired, depositKycRequired]
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        actor: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, action, actor, createdAt]
    AdminUserProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        telegram: { type: string }
        organization: { type: string }
        maskedId: { type: string }
        avatarUrl: { type: string }
        tier: { type: integer, minimum: 1, maximum: 3 }
        verificationLevel: { type: string, enum: [Verified, Pending, Rejected, Unsubmitted] }
        status: { type: string, enum: [Active, Frozen] }
        balances: { $ref: "#/components/schemas/UserBalances" }
        cards:
          type: array
          items: { $ref: "#/components/schemas/UserCard" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/KycDocument" }
        permissions: { $ref: "#/components/schemas/UserPermissions" }
        withdrawalLimits: { $ref: "#/components/schemas/EffectiveWithdrawalLimits" }
        audit:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
      required: [id, name, email, phone, telegram, organization, maskedId, tier, verificationLevel, status, balances, cards, documents, permissions, withdrawalLimits, audit]
    AdminUserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        phone: { type: string, maxLength: 40 }
        telegram: { type: string, maxLength: 80 }
        tier: { type: integer, minimum: 1, maximum: 3 }
        status: { type: string, enum: [Active, Frozen] }
        permissions: { $ref: "#/components/schemas/UserPermissions" }
    BalanceAdjustmentInput:
      type: object
      properties:
        account: { type: string, enum: [grant, deposit, card] }
        amount: { type: number, minimum: 0.01 }
        reason: { type: string, minLength: 5, maxLength: 240 }
        direction: { type: string, enum: [credit, debit], default: credit, description: "credit adds to the balance; debit removes from it (never below $0, nor below what pending withdrawals hold)" }
      required: [account, amount, reason]
    WithdrawalLimits:
      type: object
      properties:
        maxPerRequest: { type: [number, "null"], description: "Largest single withdrawal in USD; null = no limit" }
        dailyTotal: { type: [number, "null"], description: "Most that can be withdrawn in any 24 hours (under review + approved); null = no limit" }
      required: [maxPerRequest, dailyTotal]
    UserWithdrawalLimitsUpdate:
      type: object
      properties:
        custom: { type: boolean, description: "false = use the global limits; true = the limits below replace them for this user" }
        maxPerRequest: { type: [number, "null"] }
        dailyTotal: { type: [number, "null"] }
      required: [custom]
    EffectiveWithdrawalLimits:
      type: object
      properties:
        custom: { type: boolean, description: "Whether these are the user's own limits rather than the global ones" }
        maxPerRequest: { type: [number, "null"] }
        dailyTotal: { type: [number, "null"] }
        usedLast24h: { type: number, description: "Withdrawals under review or approved in the last 24 hours" }
      required: [custom, maxPerRequest, dailyTotal, usedLast24h]
    CardIssueInput:
      type: object
      properties:
        kind: { type: string, enum: [Virtual, Physical] }
        network: { type: string, enum: [Visa, Mastercard] }
      required: [kind, network]
      additionalProperties: false
    CardActionInput:
      type: object
      properties:
        action: { type: string, enum: [activate, freeze, unfreeze, cancel] }
        reason: { type: string, maxLength: 240, description: "Required (5+ characters) to freeze or cancel; shown to the user" }
      required: [action]
      additionalProperties: false
    ApplicantCardActionInput:
      type: object
      properties:
        action: { type: string, enum: [freeze, unfreeze, request-activation] }
      required: [action]
      additionalProperties: false
    GlobalFreezeUpdate:
      type: object
      properties:
        frozen: { type: boolean }
        reason: { type: string, maxLength: 240 }
      required: [frozen]
    GlobalFreezeStatus:
      type: object
      properties:
        frozen: { type: boolean }
      required: [frozen]
    ReasonInput:
      type: object
      properties:
        reason: { type: string, minLength: 5, maxLength: 240 }
      required: [reason]
    AdminApplication:
      allOf:
        - $ref: "#/components/schemas/ApplicantApplication"
        - type: object
          properties:
            userId: { type: string }
            userName: { type: string }
            organization: { type: string }
          required: [userId, userName, organization]
    AdminApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/AdminApplication"
        - type: object
          properties:
            updatedAt: { type: string, format: date-time }
            userStatus: { type: string, enum: [Active, Frozen] }
            platformFrozen: { type: boolean }
            allowedDecisions:
              type: array
              items: { type: string, enum: [Review, Approved, Declined, Changes requested] }
            documents:
              type: array
              items: { $ref: "#/components/schemas/StoredDocument" }
            events:
              type: array
              items: { $ref: "#/components/schemas/ApplicationEvent" }
          required: [updatedAt, userStatus, platformFrozen, allowedDecisions, documents, events]
    ApplicationDecisionInput:
      type: object
      properties:
        status: { type: string, enum: [Review, Approved, Declined, Changes requested] }
        note: { type: string, maxLength: 1000 }
      required: [status]
    AdminRequest:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        kind: { type: string, enum: [Deposit, Withdrawal] }
        amount: { type: number }
        note: { type: string }
        status: { type: string, enum: [Pending, Completed, Declined] }
        createdAt: { type: string, format: date-time }
        userId: { type: string }
        userName: { type: string }
        organization: { type: string }
        userStatus: { type: string, enum: [Active, Frozen] }
        verificationLevel: { type: string, enum: [Verified, Pending, Rejected, Unsubmitted] }
        kycRequired: { type: boolean, description: "Whether this user's settings require verification for this kind of request" }
        limitWarning: { type: string, description: "Set when a pending withdrawal is above the user's current limit" }
        grantBalance: { type: number }
        depositBalance: { type: number }
        reviewNote: { type: string }
        reviewedBy: { type: string }
        reviewedAt: { type: string, format: date-time }
      required: [id, reference, kind, amount, note, status, createdAt, userId, userName, organization, userStatus, verificationLevel, kycRequired, grantBalance, depositBalance]
    LedgerEntry:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        userId: { type: string }
        userName: { type: string }
        kind: { type: string, enum: [Top-up, Debit, Deposit, Withdrawal, Grant award, Opening balance] }
        account: { type: string, enum: [grant, deposit, card] }
        amount: { type: number, description: "Signed: negative amounts left the account" }
        reason: { type: string }
        actor: { type: string }
        requestId: { type: string }
        applicationId: { type: string }
      required: [id, createdAt, userId, userName, kind, account, amount, reason, actor]
    AdminAuditEntry:
      type: object
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        action: { type: string }
        actor: { type: string }
        userId: { type: [string, "null"] }
        userName: { type: [string, "null"], description: "null for platform-wide entries" }
      required: [id, createdAt, action, actor, userId, userName]
    AdminAuditPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminAuditEntry" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        actors:
          type: array
          items: { type: string }
          description: Everyone who appears as "done by" in the log, for the filter
      required: [items, total, page, pageSize, actors]
    AdminLedgerPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        inflow: { type: number, description: "Sum of positive amounts across all matching entries" }
        outflow: { type: number, description: "Sum of negative amounts across all matching entries, as a positive number" }
      required: [items, total, page, pageSize, inflow, outflow]
    AdminKycItem:
      allOf:
        - $ref: "#/components/schemas/KycDocument"
        - type: object
          properties:
            userId: { type: string }
            userName: { type: string }
            organization: { type: string }
            verificationLevel: { type: string, enum: [Verified, Pending, Rejected, Unsubmitted] }
            reviewedBy: { type: string }
          required: [userId, userName, organization, verificationLevel]
    AdminKycQueue:
      type: object
      properties:
        pending:
          type: array
          items: { $ref: "#/components/schemas/AdminKycItem" }
        reviewed:
          type: array
          description: The 20 most recent decisions
          items: { $ref: "#/components/schemas/AdminKycItem" }
      required: [pending, reviewed]
    KycReviewInput:
      type: object
      properties:
        decision: { type: string, enum: [Verified, Rejected] }
        note: { type: string, maxLength: 240 }
      required: [decision]
    AdminSearchUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        organization: { type: string }
      required: [id, name, email, organization]
    AdminSearchAudit:
      type: object
      properties:
        id: { type: string }
        action: { type: string }
        actor: { type: string }
        userId: { type: string }
        subject: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, action, actor, subject, createdAt]
    AdminSearchResults:
      type: object
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/AdminSearchUser" }
        applications:
          type: array
          items: { $ref: "#/components/schemas/AdminApplication" }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
        audit:
          type: array
          items: { $ref: "#/components/schemas/AdminSearchAudit" }
      required: [users, applications, transactions, audit]
