          description: Updated freeze status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalFreezeStatus"
  /admin/search:
    get:
      operationId: searchAdmin
      tags: [admin]
      summary: Search users, applications, ledger entries and audit logs by name or ID
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        "200":
          description: Up to five matches per group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSearchResults" }
  /admin/applications:
    get:
      operationId: listAdminApplications
      tags: [admin]
      summary: List applications for review
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, all], default: all } }
        - { name: userId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Applications, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminApplication" }
  /admin/applications/{applicationId}:
    get:
      operationId: getAdminApplication
      tags: [admin]
      summary: Get an application with its documents and history
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminApplicationDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/applications/{applicationId}/decision:
    post:
      operationId: decideAdminApplication
      tags: [admin]
      summary: Move an application to review, approve, decline or request changes
      parameters:
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationDecisionInput" }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminApplicationDetail" }
        "400":
          description: Decision refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/payment-methods:
    get:
      operationId: listAdminPaymentMethods
      tags: [admin]
      summary: Deposit or withdrawal methods (Payment Gateway)
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [Deposit, Withdrawal] } }
      responses:
        "200":
          description: Methods, in order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentMethod" }
    post:
      operationId: createAdminPaymentMethod
      tags: [admin]
      summary: Create a deposit or withdrawal method
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentMethodCreate" }
      responses:
        "201":
          description: The new method
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/payment-methods/{methodId}:
    get:
      operationId: getAdminPaymentMethod
      tags: [admin]
      summary: One payment method
      parameters:
        - { name: methodId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The method
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    patch:
      operationId: updateAdminPaymentMethod
      tags: [admin]
      summary: Change a payment method (only the parts sent); requests already placed keep their own copy
      parameters:
        - { name: methodId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentMethodUpdate" }
      responses:
        "200":
          description: The changed method
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: deleteAdminPaymentMethod
      tags: [admin]
      summary: Delete a method that was never used (a used method can only be disabled)
      parameters:
        - { name: methodId, in: path, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/payment-methods/{methodId}/move:
    post:
      operationId: moveAdminPaymentMethod
      tags: [admin]
      summary: Move a method one place up or down
      parameters:
        - { name: methodId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentMethodMove" }
      responses:
        "200":
          description: The list in its new order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentMethod" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/payment-methods/{methodId}/logo:
    post:
      operationId: uploadAdminPaymentMethodLogo
      tags: [admin]
      summary: Upload a method's logo (PNG, JPEG or WebP, up to 2 MB)
      parameters:
        - { name: methodId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/FileUpload" }
      responses:
        "200":
          description: The method with its new logo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
    delete:
      operationId: deleteAdminPaymentMethodLogo
      tags: [admin]
      summary: Remove a method's logo
      parameters:
        - { name: methodId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The method without a logo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/payment-methods/{methodId}/logo-url:
    post:
      operationId: setAdminPaymentMethodLogoUrl
      tags: [admin]
      summary: Take a method's logo from an image link (downloaded once and stored; never hot-linked)
      parameters:
        - { name: methodId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoUrlInput" }
      responses:
        "200":
          description: The method with its new logo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentMethod" }
        "400":
          description: Refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/users/{userId}/withdrawal-sources:
    put:
      operationId: updateUserWithdrawalSources
      tags: [admin]
      summary: Choose which balances a user can withdraw from
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawalSourcesUpdate" }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserProfile" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/requests:
    get:
      operationId: listAdminRequests
      tags: [admin]
      summary: List deposit or withdrawal requests
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [Deposit, Withdrawal] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, decided], default: pending } }
      responses:
        "200":
          description: Requests (pending oldest first, decided newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminRequest" }
  /admin/requests/{requestId}/approve:
    post:
      operationId: approveAdminRequest
      tags: [admin]
      summary: Approve a pending request and move the money, with an optional note for the applicant
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveInput" }
      responses:
        "200":
          description: Approved request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRequest" }
        "400":
          description: Approval refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/requests/{requestId}/reject:
    post:
      operationId: rejectAdminRequest
      tags: [admin]
      summary: Decline a pending request with a reason
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonInput" }
      responses:
        "200":
          description: Declined request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRequest" }
  /admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [admin]
      summary: Search the ledger
      parameters: &ledgerFilters
        - { name: type, in: query, required: false, schema: { type: string, enum: [all, Top-up, Debit, Deposit, Withdrawal, Grant award, Opening balance, Fee, Card purchase, Card top-up, Application fee], default: all } }
        - { name: userId, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
        - { name: to, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: One page of ledger entries, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLedgerPage" }
  /admin/transactions/export:
    get:
      operationId: exportAdminTransactions
      tags: [admin]
      summary: Download the filtered ledger as CSV
      parameters: *ledgerFilters
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /admin/audit:
    get:
      operationId: listAdminAudit
      tags: [admin]
      summary: Search the audit log
      parameters: &auditFilters
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: userId, in: query, required: false, schema: { type: string, maxLength: 100 }, description: "A user ID, or 'platform' for entries not tied to a user" }
        - { name: actor, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: from, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
        - { name: to, in: query, required: false, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: One page of audit entries, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAuditPage" }
        "400":
          description: Invalid filters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
  /admin/audit/export:
    get:
      operationId: exportAdminAudit
      tags: [admin]
      summary: Download the filtered audit log as CSV
      parameters: *auditFilters
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
  /admin/kyc:
    get:
      operationId: getAdminKycQueue
      tags: [admin]
      summary: Identity documents awaiting review, and recent decisions
      responses:
        "200":
          description: KYC queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminKycQueue" }
  /admin/kyc/documents/{documentId}/review:
    post:
      operationId: reviewAdminKycDocument
      tags: [admin]
      summary: Approve or reject an identity document
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KycReviewInput" }
      responses:
        "200":
          description: Reviewed document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminKycItem" }
        "400":
          description: Review refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorMessage" }
components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    sessionCookie:
      type: apiKey
      in: cookie
      name: gp_session
  schemas:
    ApplicantPreferences:
      type: object
      properties:
        emailNotifications: { type: boolean }
      required: [emailNotifications]
      additionalProperties: false
    AuthConfig:
      type: object
      properties:
        mode: { type: string, enum: [supabase, demo] }
        supabaseUrl: { type: [string, "null"] }
        publishableKey: { type: [string, "null"] }
        supportEmail: { type: [string, "null"], description: "Where people can write for help (Admin Settings → Email)" }
      required: [mode, supabaseUrl, publishableKey, supportEmail]
    Me:
      type: object
      properties:
        mode: { type: string, enum: [supabase, demo] }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [applicant, admin, root] }
        profileId: { type: [string, "null"] }
      required: [mode, email, name, role, profileId]
    Session:
      type: object
      properties:
        expiresAt: { type: [string, "null"], format: date-time }
      required: [expiresAt]
    TierLimits:
      type: object
      properties:
        maxPerRequest: { type: [number, "null"], description: "USD; null = no limit" }
        dailyTotal: { type: [number, "null"], description: "USD over any 24 hours; null = no limit" }
      required: [maxPerRequest, dailyTotal]
    TierCardRule:
      type: object
      properties:
        key: { $ref: "#/components/schemas/CardTypeKey" }
        name: { type: string }
        virtual: { type: boolean }
        physical: { type: boolean }
      required: [key, name, virtual, physical]
    TierRule:
      type: object
      properties:
        tier: { type: integer, minimum: 1, maximum: 3 }
        withdrawal: { $ref: "#/components/schemas/TierLimits" }
        topUp: { $ref: "#/components/schemas/TierLimits" }
        cards:
          type: array
          items: { $ref: "#/components/schemas/TierCardRule" }
      required: [tier, withdrawal, topUp, cards]
    TierUpgradeForm:
      type: object
      properties:
        intro: { type: string, maxLength: 2000 }
        fields:
          type: array
          maxItems: 30
          items: { $ref: "#/components/schemas/PlanField" }
      required: [intro, fields]
    AdminTierSetting:
      allOf:
        - { $ref: "#/components/schemas/TierRule" }
        - type: object
          properties:
            upgradeForm:
              description: "The form to move up to this tier; null = upgrades to it are off (always null for Tier 1)"
              oneOf:
                - { $ref: "#/components/schemas/TierUpgradeForm" }
                - { type: "null" }
          required: [upgradeForm]
    AdminTierSettings:
      type: object
      properties:
        tiers:
          type: array
          items: { $ref: "#/components/schemas/AdminTierSetting" }
        warnings:
          type: array
          items: { type: string }
          description: Setup problems, e.g. a tier that may buy a physical card but no virtual card
      required: [tiers, warnings]
    TierSettingsUpdate:
      type: object
      properties:
        tiers:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            properties:
              tier: { type: integer, minimum: 1, maximum: 3 }
              withdrawal: { $ref: "#/components/schemas/TierLimits" }
              topUp: { $ref: "#/components/schemas/TierLimits" }
              cards:
                type: array
                maxItems: 10
                items:
                  type: object
                  properties:
                    key: { $ref: "#/components/schemas/CardTypeKey" }
                    virtual: { type: boolean }
                    physical: { type: boolean }
                  required: [key, virtual, physical]
              upgradeForm:
                oneOf:
                  - { $ref: "#/components/schemas/TierUpgradeForm" }
                  - { type: "null" }
            required: [tier, withdrawal, topUp, cards]
      required: [tiers]
    TierRequest:
      type: object
      properties:
        id: { type: string }
        fromTier: { type: integer }
        toTier: { type: integer }
        status: { type: string, enum: [Pending, Approved, Declined] }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decisionNote: { type: string, description: "Decline reason, or the note added on approval" }
        intro: { type: string }
        answers:
          type: array
          items: { $ref: "#/components/schemas/ApplicationAnswer" }
      required: [id, fromTier, toTier, status, submittedAt, intro, answers]
    ApplicantTier:
      type: object
      properties:
        tier: { type: integer, minimum: 1, maximum: 3 }
        customWithdrawalLimits: { type: boolean, description: "An admin set this user's own withdrawal limits; they replace the tier's" }
        tiers:
          type: array
          items: { $ref: "#/components/schemas/TierRule" }
        next:
          description: "The tier the user can ask for next, with its form; null = none open (or already on Tier 3)"
          oneOf:
            - type: object
              properties:
                tier: { type: integer, minimum: 2, maximum: 3 }
                intro: { type: string }
                fields:
                  type: array
                  items: { $ref: "#/components/schemas/PlanField" }
              required: [tier, intro, fields]
            - { type: "null" }
        request:
          description: The latest upgrade request, if any
          oneOf:
            - { $ref: "#/components/schemas/TierRequest" }
            - { type: "null" }
      required: [tier, customWithdrawalLimits, tiers, next, request]
    TierRequestForm:
      type: object
      properties:
        answers: { type: string, description: "JSON object of answers by field id (file fields are sent in files)" }
        fileFields: { type: string, description: "JSON array: the field id each file in files is for, in the same order" }
        files:
          type: array
          items: { type: string, format: binary }
      required: [answers]
    AdminTierRequest:
      allOf:
        - { $ref: "#/components/schemas/TierRequest" }
        - type: object
          properties:
            decidedBy: { type: string }
            user:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                email: { type: string }
                tier: { type: integer }
                verificationLevel: { type: string, enum: [Verified, Pending, Rejected, Unsubmitted] }
                avatarUrl: { type: string }
              required: [id, name, email, tier, verificationLevel]
          required: [user]
    TierDecisionInput:
      type: object
      properties:
        decision: { type: string, enum: [approve, decline] }
        note: { type: string, maxLength: 500, description: "Required (5+ characters) to decline; optional note when approving" }
      required: [decision]
    BrandPalette:
      type: object
      properties:
        brand: { type: string }
        fg: { type: string, description: "Text on the brand colour" }
        ink: { type: string, description: "The brand as text on white" }
        glow: { type: string, description: "The brand as text on the admin's black" }
        dark: { type: string }
        light: { type: string }
        soft: { type: string }
        soft2: { type: string }
      required: [brand, fg, ink, glow, dark, light, soft, soft2]
    Branding:
      type: object
      properties:
        appName: { type: string }
        color: { type: string, description: "#RRGGBB" }
        palette: { $ref: "#/components/schemas/BrandPalette" }
        logoUrl: { type: [string, "null"] }
      required: [appName, color, palette, logoUrl]
    AdminBranding:
      allOf:
        - { $ref: "#/components/schemas/Branding" }
        - type: object
          properties:
            logoSource: { type: [string, "null"], description: "upload, or the host the logo was taken from" }
            defaults:
              type: object
              properties:
                appName: { type: string }
                color: { type: string }
              required: [appName, color]
          required: [logoSource, defaults]
    BrandingUpdate:
      type: object
      properties:
        appName: { type: string, minLength: 2, maxLength: 40 }
        color: { type: string, maxLength: 7 }
      required: [appName, color]
    LogoUrlInput:
      type: object
      properties:
        url: { type: string, maxLength: 2000 }
      required: [url]
    ErrorMessage:
      type: object
      properties:
        error: { type: string }
        requestId: { type: string, description: "Only on 500 errors: the request id in the server log (the message quotes its first 8 characters)" }
        upgradeTier: { type: integer, minimum: 2, maximum: 3, description: "Step 9.4: refused by a tier limit; upgrading to this tier would raise it (show an Upgrade button)" }
      required: [error]
    ClientErrorReport:
      type: object
      description: "A crash in the browser. Logged on the server and, when SENTRY_DSN is set, forwarded to Sentry with personal data scrubbed."
      properties:
        kind: { type: string, enum: [error, unhandledrejection, boundary, test] }
        type: { type: string, maxLength: 100, description: "Error class, e.g. TypeError" }
        message: { type: string, maxLength: 1000 }
        stack: { type: string, maxLength: 8000 }
        path: { type: string, maxLength: 300, description: "The page's path, without the query string" }
      required: [kind, message, path]
      additionalProperties: false
    ClientErrorReceipt:
      type: object
      properties:
        reference: { type: string, description: "Short reference to quote to support; it is in the server log" }
      required: [reference]
    EmailSettingSource:
      type: string
      enum: [settings, environment, none]
    EmailSettingValue:
      type: object
      properties:
        value: { type: [string, "null"] }
        source: { $ref: "#/components/schemas/EmailSettingSource" }
      required: [value, source]
    EmailSecretStatus:
      type: object
      properties:
        set: { type: boolean }
        source: { $ref: "#/components/schemas/EmailSettingSource" }
        hint: { type: [string, "null"], description: "e.g. re_••••abcd; the secret itself is never returned" }
        updatedAt: { type: [string, "null"] }
        updatedBy: { type: [string, "null"] }
        unreadable: { type: boolean, description: "Saved, but can't be decrypted with the current SETTINGS_ENCRYPTION_KEY" }
      required: [set, source, hint, updatedAt, updatedBy, unreadable]
    EmailSettings:
      type: object
      properties:
        canStoreSecrets: { type: boolean }
        encryptionProblem: { type: [string, "null"] }
        apiKey: { $ref: "#/components/schemas/EmailSecretStatus" }
        hookSecret: { $ref: "#/components/schemas/EmailSecretStatus" }
        fromName: { $ref: "#/components/schemas/EmailSettingValue" }
