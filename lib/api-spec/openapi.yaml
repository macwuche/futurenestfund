      type: object
      properties:
        custom: { type: boolean, description: "false = use the tier's limits; true = the limits below replace them for this user" }
        maxPerRequest: { type: [number, "null"] }
        dailyTotal: { type: [number, "null"] }
      required: [custom]
    EffectiveWithdrawalLimits:
      type: object
      properties:
        custom: { type: boolean, description: "Whether these are the user's own limits rather than their tier's" }
        maxPerRequest: { type: [number, "null"] }
        dailyTotal: { type: [number, "null"] }
        usedLast24h: { type: number, description: "Withdrawals under review or approved in the last 24 hours" }
      required: [custom, maxPerRequest, dailyTotal, usedLast24h]
